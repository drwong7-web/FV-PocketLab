  <body>
    <style>
      #app-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1419;z-index:9999;transition:opacity .2s ease;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
      #app-splash .dot{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,hsl(142 70% 45%),hsl(160 70% 40%));box-shadow:0 0 24px hsla(142,70%,45%,.5);animation:pulse 1.1s ease-in-out infinite}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
    </style>
    <div id="app-splash" aria-hidden="true"><div class="dot"></div></div>
