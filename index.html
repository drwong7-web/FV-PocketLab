<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1419" />
    <title>SprintLab FV Pro — Sprint & Force-Velocity Analysis</title>
    <meta name="description" content="Sport science platform for sprint testing and Force-Velocity profiling: F0, V0, Pmax, phase detection and PDF reports." />
    <meta property="og:title" content="SprintLab FV Pro" />
    <meta property="og:description" content="Sprint & Force-Velocity profiling for sport scientists." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <style>
      #app-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f1419;z-index:9999;transition:opacity .2s ease}
      #app-splash .dot{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,hsl(142 70% 45%),hsl(160 70% 40%));box-shadow:0 0 24px hsla(142,70%,45%,.5);animation:pulse 1.1s ease-in-out infinite}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
    </style>
    <div id="app-splash" aria-hidden="true"><div class="dot"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
